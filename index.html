<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>KK | The Future of Motion</title>

  <meta name="description" content="KK — engineering the future of high-performance mobility.">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #050505;
      color: #ffffff;
      line-height: 1.6;
    }

    /* NAVIGATION */
    nav {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      z-index: 1000;
      padding: 20px 7%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(5, 5, 5, 0.85);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }

    .logo {
      font-size: 30px;
      font-weight: 900;
      letter-spacing: 5px;
      color: #ffffff;
    }

    nav ul {
      display: flex;
      list-style: none;
      gap: 30px;
    }

    nav a {
      color: #cccccc;
      text-decoration: none;
      font-size: 14px;
      transition: 0.3s;
    }

    nav a:hover {
      color: #ffffff;
    }

    /* HERO */
    .hero {
      min-height: 100vh;
      display: flex;
      align-items: center;
      padding: 120px 7% 80px;
      position: relative;
      overflow: hidden;
      background:
        radial-gradient(circle at 80% 30%, rgba(255,255,255,0.12), transparent 30%),
        radial-gradient(circle at 20% 80%, rgba(180,180,180,0.08), transparent 30%),
        #050505;
    }

    .hero-content {
      max-width: 800px;
      position: relative;
      z-index: 2;
    }

    .tag {
      color: #999999;
      text-transform: uppercase;
      letter-spacing: 5px;
      font-size: 13px;
      margin-bottom: 20px;
    }

    .hero h1 {
      font-size: clamp(60px, 13vw, 150px);
      line-height: 0.85;
      letter-spacing: -7px;
      margin-bottom: 30px;
    }

    .hero h1 span {
      color: #888888;
    }

    .hero p {
      max-width: 560px;
      color: #aaaaaa;
      font-size: 18px;
      margin-bottom: 35px;
    }

    .button {
      display: inline-block;
      padding: 15px 30px;
      border: 1px solid #ffffff;
      color: #ffffff;
      text-decoration: none;
      font-weight: bold;
      letter-spacing: 1px;
      transition: 0.3s;
    }

    .button:hover {
      background: #ffffff;
      color: #000000;
    }

    /* SECTIONS */
    section {
      padding: 100px 7%;
    }

    .section-title {
      font-size: 45px;
      margin-bottom: 15px;
      letter-spacing: -2px;
    }

    .section-text {
      color: #999999;
      max-width: 650px;
      margin-bottom: 50px;
    }

    /* VISION */
    .vision {
      background: #0a0a0a;
    }

    .vision-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
    }

    .card {
      padding: 35px;
      min-height: 230px;
      border: 1px solid #222222;
      background: linear-gradient(145deg, #101010, #070707);
      transition: 0.4s;
    }

    .card:hover {
      transform: translateY(-8px);
      border-color: #777777;
    }
